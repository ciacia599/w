<!DOCTYPE html>
<html lang="zh-CN" data-theme="morandi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#a8b8d0">
<title>私语 · Private Chat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="css/style.css?v=20261002e">
</head>
<body>

<!-- ============ 背景层 ============ -->
<div class="bg-layer">
  <div class="bg-blob blob-1"></div>
  <div class="bg-blob blob-2"></div>
  <div class="bg-blob blob-3"></div>
</div>

<!-- ============ 主应用 ============ -->
<div id="app" class="app">
  <!-- 侧栏 -->
  <aside class="sidebar glass-panel">
    <div class="sidebar-header">
      <div class="user-chip">
        <img class="user-avatar" id="current-avatar" src="" alt="">
        <span class="user-name" id="current-nickname"></span>
      </div>
      <button class="icon-btn" id="btn-settings" title="设置"><i class="fas fa-cog"></i></button>
    </div>

    <div class="search-box">
      <i class="fas fa-search"></i>
      <input type="text" id="session-search" placeholder="搜索联系人 / 消息">
    </div>

    <div class="tab-bar">
      <button class="tab-item active" data-tab="chats"><i class="fas fa-comment-dots"></i> 会话</button>
      <button class="tab-item" data-tab="home"><i class="fas fa-house"></i> 主页</button>
      <button class="tab-item" data-tab="contacts"><i class="fas fa-address-book"></i> 联系人</button>
      <button class="tab-item" data-tab="spaces"><i class="fas fa-compass"></i> 空间</button>
    </div>

    <div class="session-list" id="session-list"></div>

    <div class="sidebar-actions">
      <button class="action-btn" id="btn-new-chat"><i class="fas fa-plus"></i> 发起私聊</button>
      <button class="action-btn" id="btn-new-group"><i class="fas fa-users"></i> 创建群聊</button>
    </div>
  </aside>

  <!-- 聊天主区 -->
  <main class="chat-area glass-panel">
    <div id="chat-empty" class="chat-empty">
      <i class="fas fa-comments"></i>
      <p>选择一个会话开始聊天</p>
    </div>

    <div id="chat-window" class="chat-window hidden">
      <header class="chat-header">
        <div class="chat-title">
          <img class="chat-avatar" id="chat-avatar" src="">
          <div>
            <div class="chat-name" id="chat-name"></div>
            <div class="chat-status" id="chat-status"><span class="dot-online"></span> 在线</div>
          </div>
        </div>
        <div class="chat-actions">
          <button class="icon-btn" id="btn-video" title="视频通话"><i class="fas fa-video"></i></button>
          <button class="icon-btn" id="btn-chat-exit" title="退出聊天"><i class="fas fa-right-from-bracket"></i></button>
          <button class="icon-btn" id="btn-search-msg" title="搜索消息"><i class="fas fa-search"></i></button>
          <button class="icon-btn" id="btn-chat-info" title="聊天信息"><i class="fas fa-info-circle"></i></button>
        </div>
      </header>

      <div class="messages" id="messages"></div>

      <div class="typing-indicator" id="typing-indicator">
        <span></span><span></span><span></span>
      </div>

      <div class="input-area">
        <div class="input-toolbar">
          <button class="tool-btn" id="btn-emoji" title="表情"><i class="far fa-smile"></i></button>
          <button class="tool-btn" id="btn-image" title="图片"><i class="far fa-image"></i></button>
          <button class="tool-btn" id="btn-file" title="文件"><i class="fas fa-paperclip"></i></button>
          <button class="tool-btn" id="btn-link" title="分享链接(抖音/B站/小红书)"><i class="fas fa-link"></i></button>
          <button class="tool-btn" id="btn-voice" title="语音"><i class="fas fa-microphone"></i></button>
          <button class="tool-btn" id="btn-redpacket" title="红包"><i class="fas fa-gift"></i></button>
          <button class="tool-btn" id="btn-ask" title="提问"><i class="fas fa-question-circle"></i></button>
          <span class="tool-divider"></span>
          <button class="tool-btn" id="btn-diary" title="日记"><i class="fas fa-book"></i></button>
          <button class="tool-btn" id="btn-letter" title="写信"><i class="fas fa-envelope"></i></button>
          <button class="tool-btn" id="btn-note" title="留言"><i class="fas fa-note-sticky"></i></button>
          <button class="tool-btn" id="btn-pomodoro" title="番茄钟"><i class="fas fa-stopwatch"></i></button>
          <button class="tool-btn" id="btn-memo" title="备忘录"><i class="fas fa-bell"></i></button>
          <button class="tool-btn" id="btn-game" title="游戏"><i class="fas fa-gamepad"></i></button>
          <button class="tool-btn" id="btn-listen" title="一起听歌"><i class="fas fa-music"></i></button>
          <button class="tool-btn" id="btn-watch" title="一起观影"><i class="fas fa-film"></i></button>
          <button class="tool-btn" id="btn-read" title="一起读书"><i class="fas fa-book-open"></i></button>
          <span class="tool-divider"></span>
          <button class="tool-btn" id="btn-decide" title="抉择"><i class="fas fa-dice"></i></button>
          <button class="tool-btn" id="btn-calendar" title="日历"><i class="fas fa-calendar-days"></i></button>
          <button class="tool-btn" id="btn-mood" title="心情手账"><i class="fas fa-heart"></i></button>
          <button class="tool-btn" id="btn-fortune" title="运势占卜"><i class="fas fa-hat-wizard"></i></button>
          <button class="tool-btn" id="btn-fish" title="摸鱼小计"><i class="fas fa-fish"></i></button>
          <button class="tool-btn" id="btn-checkin" title="查岗"><i class="fas fa-location-dot"></i></button>
          <button class="tool-btn" id="btn-stats" title="聊天统计"><i class="fas fa-chart-simple"></i></button>
          <button class="tool-btn" id="btn-expense" title="记账"><i class="fas fa-wallet"></i></button>
          <button class="tool-btn" id="btn-piggy" title="存钱罐"><i class="fas fa-piggy-bank"></i></button>
          <button class="tool-btn" id="btn-shop" title="商城"><i class="fas fa-store"></i></button>
          <span class="tool-divider"></span>
          <button class="tool-btn" id="btn-wheel" title="幸运转盘"><i class="fas fa-arrows-spin"></i></button>
          <button class="tool-btn" id="btn-kitchen" title="厨房"><i class="fas fa-utensils"></i></button>
          <button class="tool-btn" id="btn-draw" title="画画"><i class="fas fa-paintbrush"></i></button>
          <button class="tool-btn" id="btn-inspiration" title="灵感"><i class="fas fa-lightbulb"></i></button>
        </div>
        <div class="input-row">
          <textarea id="message-input" rows="1" placeholder="输入消息... (Enter 发送 Shift+Enter 换行)"></textarea>
          <button class="send-btn" id="btn-send"><i class="fas fa-paper-plane"></i></button>
        </div>
      </div>
    </div>
  </main>
</div>

<!-- ============ 模态框容器 ============ -->
<div id="modal-root"></div>

<!-- ============ 提示容器 ============ -->
<div id="toast-container"></div>

<script src="js/core.js?v=20261002e"></script>
<script src="js/ui.js?v=20261002e"></script>
<script src="js/messaging.js?v=20261002e"></script>
<script src="js/features.js?v=20261002e"></script>
<script src="js/extras.js?v=20261002e"></script>
<script src="js/group.js?v=20261002e"></script>
<script src="js/settings.js?v=20261002e"></script>
<script src="js/features2.js?v=20261002e"></script>
<script src="js/features3.js?v=20261002e"></script>
<script src="js/features4.js?v=20261002e"></script>
<script src="js/features5.js?v=20261002e"></script>
<script src="js/features6.js?v=20261002e"></script>
<script src="js/features7.js?v=20261002e"></script>
<script src="js/features8.js?v=20261002e"></script>
<script src="js/features9.js?v=20261002e"></script>
<script src="js/app.js?v=20261002e"></script>
</body>
</html>
